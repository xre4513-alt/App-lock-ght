          cat > app/src/main/java/com/applock/SetupActivity.kt << 'EOF'
          package com.applock

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class SetupActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_setup)

                  val pinInput = findViewById<EditText>(R.id.etPin)
                  val patternInput = findViewById<EditText>(R.id.etPattern)
                  val saveBtn = findViewById<Button>(R.id.btnSave)

                  saveBtn.setOnClickListener {
                      val pin = pinInput.text.toString()
                      val pattern = patternInput.text.toString()

                      if (pin.length != 4 || !pin.all { it.isDigit() }) {
                          Toast.makeText(this, "Enter 4-digit PIN", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      if (pattern.isEmpty()) {
                          Toast.makeText(this, "Enter pattern (e.g., 0-1-2-5-8)", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      Prefs.setPin(this, pin)
                      Prefs.setPattern(this, pattern)
                      Prefs.setSetup(this, true)
                      Toast.makeText(this, "Setup complete!", Toast.LENGTH_SHORT).show()
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/applock/LockActivity.kt << 'EOF'
          package com.applock

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat

          class LockActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_lock)

                  showBiometric()

                  val pinInput = findViewById<EditText>(R.id.etUnlockPin)
                  val patternInput = findViewById<EditText>(R.id.etUnlockPattern)

                  findViewById<Button>(R.id.btnUnlockPin).setOnClickListener {
                      if (pinInput.text.toString() == Prefs.getPin(this)) unlock()
                      else {
                          Toast.makeText(this, "Wrong PIN", Toast.LENGTH_SHORT).show()
                          pinInput.text?.clear()
                      }
                  }

                  findViewById<Button>(R.id.btnUnlockPattern).setOnClickListener {
                      if (patternInput.text.toString() == Prefs.getPattern(this)) unlock()
                      else {
                          Toast.makeText(this, "Wrong Pattern", Toast.LENGTH_SHORT).show()
                          patternInput.text?.clear()
                      }
                  }

                  findViewById<Button>(R.id.btnBiometric).setOnClickListener { showBiometric() }
              }

              private fun showBiometric() {
                  val bm = BiometricManager.from(this)
                  val auth = BiometricManager.Authenticators.BIOMETRIC_STRONG or
                          BiometricManager.Authenticators.DEVICE_CREDENTIAL
                  if (bm.canAuthenticate(auth) != BiometricManager.BIOMETRIC_SUCCESS) return

                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor,
                      object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) = unlock()
                      })

                  prompt.authenticate(
                      BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Unlock App")
                          .setSubtitle("Biometric se unlock karo")
                          .setAllowedAuthenticators(auth)
                          .build()
                  )
              }

              private fun unlock() {
                  AppLockAccessibilityService.currentlyLocked = null
                  finish()
              }

              override fun onBackPressed() {
                  val i = android.content.Intent(android.content.Intent.ACTION_MAIN)
                  i.addCategory(android.content.Intent.CATEGORY_HOME)
                  i.flags = android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                  startActivity(i)
              }
          }
          EOF

          cat > app/src/main/java/com/applock/AppLockAccessibilityService.kt << 'EOF'
          package com.applock

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class AppLockAccessibilityService : AccessibilityService() {
              companion object {
                  var currentlyLocked: String? = null
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg == packageName || pkg == "com.android.systemui") return

                  val locked = Prefs.getLockedApps(this)
                  if (locked.contains(pkg) && currentlyLocked != pkg) {
                      currentlyLocked = pkg
                      val intent = Intent(this, LockActivity::class.java).apply {
                          putExtra("target_pkg", pkg)
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      startActivity(intent)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/applock/AppListActivity.kt << 'EOF'
          package com.applock

          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity

          class AppListActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_app_list)

                  val container = findViewById<LinearLayout>(R.id.appListContainer)
                  val saveBtn = findViewById<Button>(R.id.btnSaveApps)
                  val locked = Prefs.getLockedApps(this)
                  val pm = packageManager

                  val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                      .filter { it.packageName != packageName &&
                              pm.getLaunchIntentForPackage(it.packageName) != null }
                      .sortedBy { pm.getApplicationLabel(it).toString() }

                  for (app in apps) {
                      val cb = CheckBox(this).apply {
                          text = pm.getApplicationLabel(app).toString()
                          text.setTextColor(0xFFFFFFFF.toInt())
                          isChecked = locked.contains(app.packageName)
                          setOnCheckedChangeListener { _, checked ->
                              if (checked) locked.add(app.packageName)
                              else locked.remove(app.packageName)
                          }
                      }
                      container.addView(cb)
                  }

                  saveBtn.setOnClickListener {
                      Prefs.setLockedApps(this, locked)
                      finish()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/applock/PatternView.kt << 'EOF'
          package com.applock

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View

          class PatternView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {

              var onPatternComplete: ((String) -> Unit)? = null
              private val points = Array(9) { FloatArray(2) }
              private val selected = mutableListOf<Int>()
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.GRAY; style = Paint.Style.FILL
              }
              private val selPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#03DAC6"); style = Paint.Style.FILL
              }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#6200EE"); strokeWidth = 10f; style = Paint.Style.STROKE
              }
              private var radius = 40f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val size = minOf(w, h) / 3f
                  radius = size / 6f
                  val off = size / 2f
                  for (r in 0..2) for (c in 0..2) {
                      points[r * 3 + c][0] = c * size + off
                      points[r * 3 + c][1] = r * size + off
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  for (i in 0 until 9) {
                      canvas.drawCircle(points[i][0], points[i][1], radius,
                          if (selected.contains(i)) selPaint else dotPaint)
                  }
                  for (i in 0 until selected.size - 1) {
                      val a = points[selected[i]]; val b = points[selected[i + 1]]
                      canvas.drawLine(a[0], a[1], b[0], b[1], linePaint)
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> { selected.clear(); addNear(event.x, event.y) }
                      MotionEvent.ACTION_MOVE -> addNear(event.x, event.y)
                      MotionEvent.ACTION_UP -> {
                          if (selected.isNotEmpty()) onPatternComplete?.invoke(selected.joinToString("-"))
                          postDelayed({ selected.clear(); invalidate() }, 300)
                      }
                  }
                  invalidate()
                  return true
              }

              private fun addNear(x: Float, y: Float) {
                  for (i in 0 until 9) {
                      val dx = x - points[i][0]; val dy = y - points[i][1]
                      if (dx * dx + dy * dy < radius * radius * 4 && !selected.contains(i)) selected.add(i)
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
