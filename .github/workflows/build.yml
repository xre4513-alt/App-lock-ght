          cat > app/src/main/java/com/applock/Prefs.kt << 'EOF'
          package com.applock

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey

          object Prefs {
              private const val FILE = "applock_prefs"
              private const val KEY_PIN = "pin"
              private const val KEY_PATTERN = "pattern"
              private const val KEY_SETUP = "setup_done"
              private const val KEY_APPS = "locked_apps"

              private fun prefs(ctx: Context): SharedPreferences {
                  return try {
                      val key = MasterKey.Builder(ctx)
                          .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                          .build()
                      EncryptedSharedPreferences.create(
                          ctx, FILE, key,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } catch (e: Exception) {
                      ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
                  }
              }

              fun setPin(ctx: Context, pin: String) = prefs(ctx).edit().putString(KEY_PIN, pin).apply()
              fun getPin(ctx: Context): String? = prefs(ctx).getString(KEY_PIN, null)
              fun setPattern(ctx: Context, p: String) = prefs(ctx).edit().putString(KEY_PATTERN, p).apply()
              fun getPattern(ctx: Context): String? = prefs(ctx).getString(KEY_PATTERN, null)
              fun isSetup(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_SETUP, false)
              fun setSetup(ctx: Context, done: Boolean) = prefs(ctx).edit().putBoolean(KEY_SETUP, done).apply()
              fun getLockedApps(ctx: Context): MutableSet<String> =
                  (prefs(ctx).getStringSet(KEY_APPS, mutableSetOf()) ?: mutableSetOf()).toMutableSet()
              fun setLockedApps(ctx: Context, s: Set<String>) = prefs(ctx).edit().putStringSet(KEY_APPS, s).apply()
          }
          EOF

