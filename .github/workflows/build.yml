          cat > app/src/main/java/com/applock/Prefs.kt << 'EOF'
          package com.applock

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey

          object Prefs {
              private const val FILE = "applock_prefs"
              private const val KEY_PIN = "pin"
              private const val KEY_SETUP = "setup_done"
              private const val KEY_APPS = "locked_apps"
              private const val KEY_BIOMETRIC = "biometric_enabled"

              private fun prefs(ctx: Context): SharedPreferences {
                  return try {
                      val key = MasterKey.Builder(ctx)
                          .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                          .build()
                      EncryptedSharedPreferences.create(
                          ctx, FILE, key,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } catch (e: Exception) {
                      ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
                  }
              }

              fun setPin(ctx: Context, pin: String) = prefs(ctx).edit().putString(KEY_PIN, pin).apply()
              fun getPin(ctx: Context): String? = prefs(ctx).getString(KEY_PIN, null)
              fun isSetup(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_SETUP, false)
              fun setSetup(ctx: Context, done: Boolean) = prefs(ctx).edit().putBoolean(KEY_SETUP, done).apply()
              fun getLockedApps(ctx: Context): MutableSet<String> =
                  (prefs(ctx).getStringSet(KEY_APPS, mutableSetOf()) ?: mutableSetOf()).toMutableSet()
              fun setLockedApps(ctx: Context, s: Set<String>) = prefs(ctx).edit().putStringSet(KEY_APPS, s).apply()
              fun isBiometricEnabled(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_BIOMETRIC, false)
              fun setBiometricEnabled(ctx: Context, enabled: Boolean) = prefs(ctx).edit().putBoolean(KEY_BIOMETRIC, enabled).apply()
          }
          EOF

          cat > app/src/main/java/com/applock/MainActivity.kt << 'EOF'
          package com.applock

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (!Prefs.isSetup(this)) {
                      startActivity(Intent(this, SetupActivity::class.java))
                      finish()
                      return
                  }

                  findViewById<Button>(R.id.btnApps).setOnClickListener {
                      startActivity(Intent(this, AppListActivity::class.java))
                  }

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  findViewById<Button>(R.id.btnChangeLock).setOnClickListener {
                      Prefs.setSetup(this, false)
                      startActivity(Intent(this, SetupActivity::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/applock/SetupActivity.kt << 'EOF'
          package com.applock

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class SetupActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_setup)

                  val pinInput = findViewById<EditText>(R.id.etPin)
                  val cbFingerprint = findViewById<CheckBox>(R.id.cbFingerprint)
                  val saveBtn = findViewById<Button>(R.id.btnSave)

                  saveBtn.setOnClickListener {
                      val pin = pinInput.text.toString()

                      if (pin.length != 4 || !pin.all { it.isDigit() }) {
                          Toast.makeText(this, "Enter valid 4-digit PIN", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      Prefs.setPin(this, pin)
                      Prefs.setBiometricEnabled(this, cbFingerprint.isChecked)
                      Prefs.setSetup(this, true)
                      
                      Toast.makeText(this, "Setup complete!", Toast.LENGTH_SHORT).show()
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                  }
              }
          }
          EOF

          # Fast Lock Activity with Custom Keypad Logic
          cat > app/src/main/java/com/applock/LockActivity.kt << 'EOF'
          package com.applock

          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat

          class LockActivity : AppCompatActivity() {
              private var currentPin = ""
              private lateinit var tvPinDisplay: TextView
              private lateinit var btnBiometric: ImageView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_lock)

                  tvPinDisplay = findViewById(R.id.tvPinDisplay)
                  btnBiometric = findViewById(R.id.btnBiometric)

                  if (Prefs.isBiometricEnabled(this)) {
                      btnBiometric.visibility = View.VISIBLE
                      showBiometric()
                  } else {
                      btnBiometric.visibility = View.GONE
                  }

                  btnBiometric.setOnClickListener { showBiometric() }
              }

              fun onNumberClick(view: View) {
                  if (currentPin.length < 4) {
                      currentPin += (view as Button).text.toString()
                      updateDisplay()
                      if (currentPin.length == 4) verifyPin()
                  }
              }

              fun onDeleteClick(view: View) {
                  if (currentPin.isNotEmpty()) {
                      currentPin = currentPin.substring(0, currentPin.length - 1)
                      updateDisplay()
                  }
              }

              fun onClearClick(view: View) {
                  currentPin = ""
                  updateDisplay()
              }

              private fun updateDisplay() {
                  val display = currentPin + "-".repeat(4 - currentPin.length)
                  tvPinDisplay.text = display
              }

              private fun verifyPin() {
                  if (currentPin == Prefs.getPin(this)) {
                      unlock()
                  } else {
                      Toast.makeText(this, "Incorrect PIN", Toast.LENGTH_SHORT).show()
                      currentPin = ""
                      updateDisplay()
                  }
              }

              private fun showBiometric() {
                  val bm = BiometricManager.from(this)
                  // Only BIOMETRIC_STRONG, removed DEVICE_CREDENTIAL so phone's system PIN doesn't show
                  val auth = BiometricManager.Authenticators.BIOMETRIC_STRONG
                  if (bm.canAuthenticate(auth) != BiometricManager.BIOMETRIC_SUCCESS) return

                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor,
                      object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) = unlock()
                          override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                              // Don't close app on cancel, just stay on PIN screen
                          }
                      })

                  prompt.authenticate(
                      BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Unlock App")
                          .setSubtitle("Scan fingerprint to unlock")
                          .setNegativeButtonText("Use PIN")
                          .setAllowedAuthenticators(auth)
                          .build()
                  )
              }

              private fun unlock() {
                  AppLockAccessibilityService.currentlyLocked = null
                  finish()
                  overridePendingTransition(0, 0)
              }

              override fun onBackPressed() {
                  val i = android.content.Intent(android.content.Intent.ACTION_MAIN)
                  i.addCategory(android.content.Intent.CATEGORY_HOME)
                  i.flags = android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                  startActivity(i)
              }
          }
          EOF

          # Highly optimized Accessibility Service for FAST lock
          cat > app/src/main/java/com/applock/AppLockAccessibilityService.kt << 'EOF'
          package com.applock

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class AppLockAccessibilityService : AccessibilityService() {
              companion object {
                  var currentlyLocked: String? = null
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  
                  // Ignore System UI, our own app, and launcher
                  if (pkg == packageName || pkg == "com.android.systemui" || 
                      pkg.contains("launcher") || pkg.contains("home")) return

                  val locked = Prefs.getLockedApps(this)
                  if (locked.contains(pkg) && currentlyLocked != pkg) {
                      currentlyLocked = pkg
                      val intent = Intent(this, LockActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or 
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP or 
                                  Intent.FLAG_ACTIVITY_NO_ANIMATION or
                                  Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS
                      }
                      startActivity(intent)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/applock/AppListActivity.kt << 'EOF'
          package com.applock

          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity

          class AppListActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_app_list)

                  val container = findViewById<LinearLayout>(R.id.appListContainer)
                  val saveBtn = findViewById<Button>(R.id.btnSaveApps)
                  val locked = Prefs.getLockedApps(this)
                  val pm = packageManager

                  val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                      .filter { it.packageName != packageName &&
                              pm.getLaunchIntentForPackage(it.packageName) != null }
                      .sortedBy { pm.getApplicationLabel(it).toString() }

                  for (app in apps) {
                      val cb = CheckBox(this).apply {
                          text = pm.getApplicationLabel(app).toString()
                          setTextColor(0xFFFFFFFF.toInt())
                          textSize = 16f
                          isChecked = locked.contains(app.packageName)
                          setOnCheckedChangeListener { _, checked ->
                              if (checked) locked.add(app.packageName)
                              else locked.remove(app.packageName)
                          }
                      }
                      container.addView(cb)
                  }

                  saveBtn.setOnClickListener {
                      Prefs.setLockedApps(this, locked)
                      finish()
                  }
              }
          }
          EOF

